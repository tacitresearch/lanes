name = "ledger"
version = "0.1.0"
defaultTargets = ["Ledger", "Release", "ledgerCheck", "ledger", "ledgerLive"]
testDriver = "ledgerCheck"

[[require]]
name = "lanes"
path = "../.."

# `Ledger.Proofs` is a root of its own so that `lake build` builds the proofs and the
# executables, which import `Ledger`, do not link them.
[[lean_lib]]
name = "Ledger"
roots = ["Ledger", "Ledger.Proofs"]

# Strangers' actors are released: checked by `#guard` when it is built.
[[lean_lib]]
name = "Release"

# Model checks, run by `lake test`. Check before you prove (Lanes rule 5.1).
[[lean_exe]]
name = "ledgerCheck"
root = "Check"


# The web application: `ledger [port] [journal] [secrets] [admin] [iterations]`.
[[lean_exe]]
name = "ledger"
root = "Main"

# Users signing up over HTTP, a transfer between them, the server killed and started again.
[[lean_exe]]
name = "ledgerLive"
root = "Live"
