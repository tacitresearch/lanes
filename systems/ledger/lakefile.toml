name = "ledger"
version = "0.1.0"
defaultTargets = ["Ledger", "ledgerCheck"]
testDriver = "ledgerCheck"

[[require]]
name = "lanes"
path = "../.."

# `Ledger.Proofs` is a root of its own so that `lake build` builds the proofs and the
# executables, which import `Ledger`, do not link them.
[[lean_lib]]
name = "Ledger"
roots = ["Ledger", "Ledger.Proofs"]

# Model checks, run by `lake test`. Check before you prove (LANES_STYLE rule 5.1).
[[lean_exe]]
name = "ledgerCheck"
root = "Check"

