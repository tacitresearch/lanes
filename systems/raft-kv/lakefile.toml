name = "raftKv"
version = "0.1.0"
defaultTargets = ["RaftKV", "RaftKVProofs", "raftCheck", "raftLive", "raftNode", "raftProcs", "raftChaos"]
testDriver = "raftCheck"

[[require]]
name = "lanes"
path = "../.."

# `RaftKV.Proofs` is a root of its own so that `lake build` builds the proofs and `raftCheck`,
# which imports `RaftKV`, does not link them.
[[lean_lib]]
name = "RaftKV"
roots = ["RaftKV", "RaftKV.Proofs"]

# What needs `Lanes.Semantics`, and so Mathlib: nothing executable imports it. `Check` is a root
# because `RaftKVProofs/Checked.lean` states what its checks mean.
[[lean_lib]]
name = "RaftKVProofs"
roots = ["RaftKVProofs", "Check"]

# Model checks, run by `lake test`. Check before you prove (LANES_STYLE rule 5.1).
[[lean_exe]]
name = "raftCheck"
root = "Check"

# Three nodes over TCP on this machine, with real timers and journals.
[[lean_exe]]
name = "raftLive"
root = "Live"

# One node as a process: `raftNode [new] <id> <http-port> <journal> <peer-port>...`
[[lean_exe]]
name = "raftNode"
root = "Main"

# What the tests on processes share: `raftNode` started, killed and asked over HTTP.
[[lean_lib]]
name = "Harness"

# Three `raftNode` processes that cut their journals, killed and started again.
[[lean_exe]]
name = "raftProcs"
root = "Procs"

# The same under random faults for a minute: `raftChaos [seconds] [seed]`. Not a test of CI.
[[lean_exe]]
name = "raftChaos"
root = "Chaos"
