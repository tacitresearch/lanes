name = "migration"
version = "0.1.0"
defaultTargets = ["Quota", "check"]
testDriver = "check"

[[require]]
name = "lanes"
path = "../.."

[[lean_lib]]
name = "Quota"
roots = ["Quota", "Quota.Axioms"]

# Model checks, and version 1 of the service started, stopped and started again as version 2
# on its journal, run by `lake test`.
[[lean_exe]]
name = "check"
root = "Check"
