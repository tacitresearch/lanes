name = "migration"
version = "0.1.0"
defaultTargets = ["Quota", "check"]
testDriver = "check"
# Lake's artifact cache: each output is stored once per toolchain, by its content, shared by
# every project on this machine, and hard-linked into `.lake/build`.
enableArtifactCache = true
restoreAllArtifacts = true

[[require]]
name = "lanes"
path = "../.."

[[lean_lib]]
name = "Quota"
roots = ["Quota", "Quota.Axioms"]

# Model checks, and version 1 of the service started, stopped and started again as version 2
# on its journal, run by `lake test`.
[[lean_exe]]
name = "check"
root = "Check"
