name = "signIn"
version = "0.1.0"
defaultTargets = ["Videos", "signIn", "check"]
testDriver = "check"
# Lake's artifact cache: each output is stored once per toolchain, by its content, shared by
# every project on this machine, and hard-linked into `.lake/build`.
enableArtifactCache = true
restoreAllArtifacts = true

[[require]]
name = "lanes"
path = "../.."

[[lean_lib]]
name = "Videos"
roots = ["Videos", "Videos.Axioms"]

# The site: `signIn [port]`, with its providers' clients in the environment.
[[lean_exe]]
name = "signIn"
root = "Main"

# What the bridge makes of requests and what the site answers, run by `lake test`.
[[lean_exe]]
name = "check"
root = "Check"
