name = "reminders"
version = "0.1.0"
defaultTargets = ["Reminders", "reminders", "test"]
testDriver = "test"
# Lake's artifact cache: each output is stored once per toolchain, by its content, shared by
# every project on this machine, and hard-linked into `.lake/build`.
enableArtifactCache = true
restoreAllArtifacts = true

[[require]]
name = "lanes"
path = "../.."

# `Reminders.Proofs` is a root of its own so that `lake build` builds the proofs and the
# executables, which import `Reminders`, do not link them.
[[lean_lib]]
name = "Reminders"
roots = ["Reminders", "Reminders.Proofs", "Reminders.Proofs.Axioms"]

# The application.
[[lean_exe]]
name = "reminders"
root = "Main"

# Model checks and the application over HTTP through a restart, run by `lake test`.
[[lean_exe]]
name = "test"
root = "Test"
