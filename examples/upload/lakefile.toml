name = "upload"
version = "0.1.0"
defaultTargets = ["Upload", "upload", "check"]
testDriver = "check"
# Lake's artifact cache: each output is stored once per toolchain, by its content, shared by
# every project on this machine, and hard-linked into `.lake/build`.
enableArtifactCache = true
restoreAllArtifacts = true

[[require]]
name = "lanes"
path = "../.."

[[lean_lib]]
name = "Upload"
globs = ["Upload.+"]

# The web application: `upload [port]`.
[[lean_exe]]
name = "upload"
root = "Main"

# Model checks of the service, and uploads through the whole front end, run by `lake test`.
[[lean_exe]]
name = "check"
root = "Check"
