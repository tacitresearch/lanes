name = "bank"
version = "0.1.0"
defaultTargets = ["Bank", "check"]
testDriver = "check"

[[require]]
name = "lanes"
path = "../.."

# `Bank.Proofs` is a root of its own so that `lake build` builds the proofs and `check`,
# which imports `Bank`, does not link them.
[[lean_lib]]
name = "Bank"
roots = ["Bank", "Bank.Proofs", "Bank.Proofs.Axioms"]

# Model checks, run by `lake test`. Check before you prove (Lanes rule 5.1).
[[lean_exe]]
name = "check"
root = "Check"
