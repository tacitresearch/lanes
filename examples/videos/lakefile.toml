name = "videos"
version = "0.1.0"
defaultTargets = ["Videos", "videosTest", "videos", "videosLive"]
testDriver = "videosTest"
# Lake's artifact cache: each output is stored once per toolchain, by its content, shared by
# every project on this machine, and hard-linked into `.lake/build`.
enableArtifactCache = true
restoreAllArtifacts = true

[[require]]
name = "lanes"
path = "../.."

[[require]]
name = "google"
path = "../../integrations/google"

[[require]]
name = "github"
path = "../../integrations/github"

# `Videos.Proofs` is a root of its own so that `lake build` builds the proofs and the
# executables, which import `Videos`, do not link them. `Videos.Check` and `Videos.EndToEnd` are
# what `videosTest` runs.
[[lean_lib]]
name = "Videos"
roots = ["Videos", "Videos.Proofs", "Videos.Check", "Videos.EndToEnd"]

# Model checks, the bridge without a socket, and the site over HTTP against a fake S3 and a fake
# identity provider, restarted on its journal: `lake test`.
[[lean_exe]]
name = "videosTest"
root = "Test"

# The site: `videos [port] [journal] [secrets]`, configured from the environment (README).
[[lean_exe]]
name = "videos"
root = "Main"

# The same flow as the end-to-end test, against the S3 bucket the environment names. Not run by
# `lake test`.
[[lean_exe]]
name = "videosLive"
root = "Live"
