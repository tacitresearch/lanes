name = "election"
version = "0.1.0"
defaultTargets = ["Election", "check"]
testDriver = "check"
# Lake's artifact cache: each output is stored once per toolchain, by its content, shared by
# every project on this machine, and hard-linked into `.lake/build`.
enableArtifactCache = true
restoreAllArtifacts = true

[[require]]
name = "lanes"
path = "../.."

# `Election.Proofs` is a root of its own so that `lake build` builds the proofs and `check`,
# which imports `Election`, does not link them.
[[lean_lib]]
name = "Election"
roots = ["Election", "Election.Proofs", "Election.Proofs.Axioms"]

# Model checks, run by `lake test`. Check before you prove (Lanes rule 5.1).
[[lean_exe]]
name = "check"
root = "Check"
