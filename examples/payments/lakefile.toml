name = "payments"
version = "0.1.0"
defaultTargets = ["Shop", "check"]
testDriver = "check"

[[require]]
name = "lanes"
path = "../.."

# `Shop.Proofs` is a root of its own so that `lake build` builds the proofs and `check`,
# which imports `Shop`, does not link them.
[[lean_lib]]
name = "Shop"
roots = ["Shop", "Shop.Proofs", "Shop.Proofs.Paid", "Shop.Proofs.Axioms"]

# Model checks, run by `lake test`. Check before you prove (Lanes rule 5.1).
[[lean_exe]]
name = "check"
root = "Check"
