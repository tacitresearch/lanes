name = "rookery"
version = "0.1.0"
defaultTargets = ["Rookery", "rookeryCheck", "rookery"]
testDriver = "rookeryCheck"
# Lake's artifact cache: each output is stored once per toolchain, by its content, shared by
# every project on this machine, and hard-linked into `.lake/build`.
enableArtifactCache = true
restoreAllArtifacts = true

[[require]]
name = "lanes"
path = "../.."

# `Rookery.Proofs` is a root of its own so that `lake build` builds the proofs and the
# executables, which import `Rookery`, do not link them.
[[lean_lib]]
name = "Rookery"
roots = ["Rookery", "Rookery.Proofs", "Rookery.Proofs.Axioms"]

# Model checks, the bridge's tests, and with LANES_POSTGRES the application on PostgreSQL,
# run by `lake test` (Lanes rule 5.1).
[[lean_exe]]
name = "rookeryCheck"
root = "Check"

# The web application: `rookery [port] [secrets] [memory_kib] [maxPerWindow] [lockout_s]`.
[[lean_exe]]
name = "rookery"
root = "Main"
