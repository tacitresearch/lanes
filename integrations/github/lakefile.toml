name = "github"
version = "0.1.0"
defaultTargets = ["GitHub", "check"]
testDriver = "check"
# Lake's artifact cache: each output is stored once per toolchain, by its content, shared by
# every project on this machine, and hard-linked into `.lake/build`.
enableArtifactCache = true
restoreAllArtifacts = true

[[require]]
name = "lanes"
path = "../.."

[[lean_lib]]
name = "GitHub"

# GitHub's answers, in the shapes its documentation gives, read by the preset; run by `lake test`.
[[lean_exe]]
name = "check"
root = "Check"
