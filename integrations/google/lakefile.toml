name = "google"
version = "0.1.0"
defaultTargets = ["Google", "check"]
testDriver = "check"
# Lake's artifact cache: each output is stored once per toolchain, by its content, shared by
# every project on this machine, and hard-linked into `.lake/build`.
enableArtifactCache = true
restoreAllArtifacts = true

[[require]]
name = "lanes"
path = "../.."

[[lean_lib]]
name = "Google"

# The preset against Google's discovery document and keys as recorded, run by `lake test`.
[[lean_exe]]
name = "check"
root = "Check"
