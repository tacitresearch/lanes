name = "aws"
version = "0.1.0"
defaultTargets = ["Aws", "check"]
testDriver = "check"
# Lake's artifact cache: each output is stored once per toolchain, by its content, shared by
# every project on this machine, and hard-linked into `.lake/build`.
enableArtifactCache = true
restoreAllArtifacts = true

[[require]]
name = "lanes"
path = "../.."

[[lean_lib]]
name = "Aws"
# The axiom gate is a root of its own, so that `lake build` checks it.
roots = ["Aws", "Aws.Axioms"]

# The refresh policy model-checked, and the credentials, S3 and SES against fakes run in the
# test; run by `lake test`. Nothing calls AWS.
[[lean_exe]]
name = "check"
root = "Check"

# SES's address check against Go's net/mail, with the repository's `oracles/go`; needs `go`.
[[lean_exe]]
name = "oracle"
root = "Oracle"

# The SES adapter and SQS's calls against moto, checked against the email and queue models;
# skipped unless LANES_MOTO is set (`oracles/moto/run.sh`).
[[lean_exe]]
name = "serviceOracle"
root = "ServiceOracle"

# What `check` runs: the model checks, and the tests against fakes run in the test.
[[lean_lib]]
name = "Checks"
globs = ["Checks.+"]
