AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  One Lanes application on AWS: an HTTPS load balancer in front of one EC2 instance that holds
  the application's shard, its journal on an EBS volume of its own with daily snapshots, a media
  bucket for uploads straight from the browser, logs and metrics in CloudWatch, deploys through
  GitHub's OIDC provider and Systems Manager, and optionally PostgreSQL. See docs/DEPLOY.md.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: The application }
        Parameters: [AppName, BinaryName, AppArguments, AppPort, HealthCheckPath, MetricsPath, DrainSeconds]
      - Label: { default: The domain }
        Parameters: [DomainName, CertificateArn, HostedZoneId]
      - Label: { default: The machine }
        Parameters: [InstanceType, JournalVolumeSize, RootVolumeSize, ImageId, LatestUbuntuImage, KeyName, VpcCidr]
      - Label: { default: Releases and deploys }
        Parameters: [ReleaseBucket, ReleasePrefix, GitHubRepository, GitHubOwnerId, GitHubRepositoryId, DeployBranch, ExistingOidcProviderArn, ScriptRepository, ScriptRef, ScriptSha256]
      - Label: { default: "Backups, logs and alarms" }
        Parameters: [SnapshotIntervalHours, SnapshotRetainCount, JournalSnapshotId, LogRetentionDays, AlarmEmail]
      - Label: { default: Media and the database }
        Parameters: [MediaUser, MailIdentity, DatabaseEngine, DatabaseInstanceClass, DatabaseStorage, DatabaseEngineVersion]

Parameters:
  AppName:
    Type: String
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}$"
    Description: >-
      The application's name, lowercase: in tags, log groups, the configuration parameter and the
      release prefix. Changing it later replaces most of the stack.
  BinaryName:
    Type: String
    AllowedPattern: "^[A-Za-z0-9_.-]{1,64}$"
    Description: The executable, as the application's lakefile names it (`lake build <name>`).
  AppArguments:
    Type: String
    Default: "{port} {journal}"
    AllowedPattern: "^[A-Za-z0-9 _./:{}=,+-]{0,512}$"
    Description: >-
      The arguments the executable is started with. {port} becomes AppPort, {journal} the
      journal's path on the volume and {data} the journal's directory, the one place the
      application may write. The application `lanes new` makes takes `[port] [journal]`.
  AppPort:
    Type: Number
    Default: 8080
    MinValue: 1024
    MaxValue: 65535
    Description: The port the application listens on, on every address (host 0.0.0.0).
  HealthCheckPath:
    Type: String
    Default: /readyz
    AllowedPattern: "^/[A-Za-z0-9_./-]*$"
    Description: >-
      What the load balancer and a deploy ask before sending traffic: the readiness path of
      ServerConfig.ops, which answers 200 once the journal is replayed. Without it, a page that
      answers 200 (every check is then a request the journal keeps).
  MetricsPath:
    Type: String
    Default: /metrics
    AllowedPattern: "^(/[A-Za-z0-9_./-]*)?$"
    Description: >-
      The metrics page of ServerConfig.ops, which the CloudWatch agent reads on the machine and
      the load balancer answers 404 from the internet. Empty for none.
  DrainSeconds:
    Type: Number
    Default: 15
    MinValue: 0
    MaxValue: 300
    Description: >-
      How long the load balancer lets requests in flight finish when the instance leaves it,
      and, with ten seconds more, how long systemd waits for the application to stop before it
      kills it.
  DomainName:
    Type: String
    AllowedPattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$"
    Description: The site's name, such as video.example.com. Media uploads are allowed from https://<it>.
  CertificateArn:
    Type: String
    Default: ""
    Description: >-
      An ACM certificate for DomainName in this region. Empty to make one, validated by DNS: in
      HostedZoneId if given, otherwise by the record the stack's events show, which you add.
  HostedZoneId:
    Type: String
    Default: ""
    Description: >-
      The Route 53 hosted zone of DomainName, optional. With it the stack validates the certificate
      and points DomainName at the load balancer.
  InstanceType:
    Type: String
    Default: t3.small
    AllowedPattern: "^(t3|t3a|m6i|m6a|m7i|m7a|c6i|c6a|c7i|c7a|r7i|r7a)\\.[a-z0-9]+$"
    Description: >-
      x86-64 and Nitro (the journal's volume is found by its NVMe name). t3.small has 2 vCPUs
      and 2 GiB. See docs/DEPLOY.md.
  JournalVolumeSize:
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 16384
    Description: GiB of gp3 for the journal and its snapshot. It can grow later, not shrink.
  RootVolumeSize:
    Type: Number
    Default: 20
    MinValue: 10
    MaxValue: 200
    Description: GiB of gp3 for the system, the releases and the logs.
  ImageId:
    Type: String
    Default: ""
    AllowedPattern: "^(ami-[0-9a-f]+)?$"
    Description: >-
      The AMI, fixed. Empty for LatestUbuntuImage, which CloudFormation reads again at every
      update, replacing the instance when Canonical has published a newer one; after the first
      deploy put the ImageId output here, so the instance changes only when you choose.
  LatestUbuntuImage:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Ubuntu 24.04, from Canonical's public parameter. Used when ImageId is empty.
  KeyName:
    Type: String
    Default: ""
    Description: >-
      An EC2 key pair, optional. The instance takes no connection from the internet; a shell is
      Session Manager (EC2, Connect).
  VpcCidr:
    Type: String
    Default: 10.80.0.0/16
    AllowedPattern: "^10\\.([0-9]{1,3})\\.0\\.0/16$"
    Description: The VPC's addresses, a /16 of 10.0.0.0/8 that no network you peer with uses.
  ReleaseBucket:
    Type: String
    Default: ""
    Description: >-
      The bucket releases are kept in. Empty to make one; give an existing one to share it
      between applications, each under its own ReleasePrefix.
  ReleasePrefix:
    Type: String
    Default: ""
    AllowedPattern: "^([A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*)?$"
    Description: The key prefix of this application's releases, without a slash at either end. Empty for AppName.
  GitHubRepository:
    Type: String
    AllowedPattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
    Description: The application's repository, as owner/name, whose workflow may deploy.
  GitHubOwnerId:
    Type: String
    Default: ""
    AllowedPattern: "^[0-9]*$"
    Description: >-
      The numeric id of the repository's owner, if the repository's OIDC subject names
      repositories by id (owner@id/name@id, as tacitresearch/lanes does). Give it with
      GitHubRepositoryId; empty for the default subject, repo:owner/name.
  GitHubRepositoryId:
    Type: String
    Default: ""
    AllowedPattern: "^[0-9]*$"
    Description: The numeric id of the repository, with GitHubOwnerId.
  DeployBranch:
    Type: String
    Default: main
    AllowedPattern: "^[A-Za-z0-9_./-]+$"
    Description: The only branch whose workflow runs may deploy.
  ExistingOidcProviderArn:
    Type: String
    Default: ""
    Description: >-
      The ARN of the account's IAM OIDC provider for token.actions.githubusercontent.com, if it
      has one already (IAM, Identity providers; the stack of infra/lanes-ci.yaml makes one).
      Empty to create it.
  ScriptRepository:
    Type: String
    Default: tacitresearch/lanes
    AllowedPattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
    Description: The public repository whose infra/app/app-instance.sh sets the instance up.
  ScriptRef:
    Type: String
    Default: main
    AllowedPattern: "^[A-Za-z0-9_./-]+$"
    Description: The branch, tag or commit of that script; a commit is best, with ScriptSha256.
  ScriptSha256:
    Type: String
    Default: ""
    AllowedPattern: "^([0-9a-f]{64})?$"
    Description: The script's SHA-256, optional; the instance refuses another.
  SnapshotIntervalHours:
    Type: Number
    Default: 24
    AllowedValues: [1, 2, 3, 4, 6, 8, 12, 24]
    Description: How often the journal's volume is snapshotted.
  SnapshotRetainCount:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 1000
    Description: How many snapshots are kept; the oldest goes when a new one is made.
  JournalSnapshotId:
    Type: String
    Default: ""
    AllowedPattern: "^(snap-[0-9a-f]+)?$"
    Description: >-
      Empty for an empty journal volume. A snapshot to restore: setting it makes a new volume
      from it (the old one is kept), which the instance mounts at its next boot. See
      docs/DEPLOY.md, "Restore".
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
    Description: How long CloudWatch keeps the application's log lines.
  AlarmEmail:
    Type: String
    Default: ""
    Description: An address told when the site has no healthy target, the journal's disk fills or the host fails. Optional.
  MediaUser:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      true makes an IAM user with the media bucket's rights only, for an S3 client that reads a
      key from the environment; you make its access key. Not needed when the application takes
      the instance role's credentials from the metadata service (integrations/aws), which
      already have those rights.
  MailIdentity:
    Type: String
    Default: ""
    AllowedPattern: "^(([A-Za-z0-9._+-]+@)?([A-Za-z0-9-]+\\.)+[A-Za-z0-9-]+)?$"
    Description: >-
      An SES identity (a verified domain or address) the instance role may send email from
      with ses:SendEmail, and nothing else. Empty for no email.
  DatabaseEngine:
    Type: String
    Default: none
    AllowedValues: [none, postgres]
    Description: postgres adds an RDS PostgreSQL instance that only the application's instance reaches.
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedPattern: "^db\\.[a-z0-9]+\\.[a-z0-9]+$"
    Description: The database's instance class.
  DatabaseStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 65536
    Description: GiB of gp3 for the database.
  DatabaseEngineVersion:
    Type: String
    Default: "17"
    AllowedValues: ["16", "17"]
    Description: The PostgreSQL major version.

Conditions:
  CreateReleaseBucket: !Equals [!Ref ReleaseBucket, ""]
  DefaultPrefix: !Equals [!Ref ReleasePrefix, ""]
  CreateCertificate: !Equals [!Ref CertificateArn, ""]
  HasZone: !Not [!Equals [!Ref HostedZoneId, ""]]
  ValidateInZone: !And [!Condition CreateCertificate, !Condition HasZone]
  HasImage: !Not [!Equals [!Ref ImageId, ""]]
  HasKey: !Not [!Equals [!Ref KeyName, ""]]
  CreateOidcProvider: !Equals [!Ref ExistingOidcProviderArn, ""]
  SubjectById: !And
    - !Not [!Equals [!Ref GitHubOwnerId, ""]]
    - !Not [!Equals [!Ref GitHubRepositoryId, ""]]
  HasScriptSha: !Not [!Equals [!Ref ScriptSha256, ""]]
  HasMetrics: !Not [!Equals [!Ref MetricsPath, ""]]
  FromSnapshot: !Not [!Equals [!Ref JournalSnapshotId, ""]]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]
  CreateMediaUser: !Equals [!Ref MediaUser, "true"]
  HasMailIdentity: !Not [!Equals [!Ref MailIdentity, ""]]
  HasDatabase: !Equals [!Ref DatabaseEngine, postgres]

Resources:
  # The network: a VPC of its own, two public subnets for the load balancer (it needs two zones),
  # the instance in the first; two private subnets for the database, made only with it. No NAT
  # gateway: the instance has a public address and takes nothing from the internet.
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Sub "lanes-${AppName}" }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: !Sub "lanes-${AppName}" }

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 16, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub "lanes-${AppName}-public-a" }

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 16, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub "lanes-${AppName}-public-b" }

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "lanes-${AppName}-public" }

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # S3 from the instance without the internet, at no charge.
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PublicRouteTable]

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "Lanes ${AppName} load balancer - HTTP and HTTPS from anywhere"
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: redirected to HTTPS }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: the site }

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "Lanes ${AppName} instance - the application's port from the load balancer only"
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref AppPort
          ToPort: !Ref AppPort
          SourceSecurityGroupId: !GetAtt LoadBalancerSecurityGroup.GroupId
          Description: the load balancer
      # A new group allows all outbound by itself: packages, S3, Systems Manager, CloudWatch,
      # and the application's own calls out.

  # The journal. A volume of its own, so that it outlives the instance: EC2 never deletes a
  # volume attached after launch when it terminates the instance, and CloudFormation keeps it
  # when the stack is deleted or the volume replaced. The instance attaches it itself at boot
  # (app-instance.sh `volume`), so a replaced instance waits for it and picks it up.
  JournalVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !GetAtt PublicSubnetA.AvailabilityZone
      VolumeType: gp3
      Size: !Ref JournalVolumeSize
      Encrypted: true
      SnapshotId: !If [FromSnapshot, !Ref JournalSnapshotId, !Ref AWS::NoValue]
      Tags:
        - { Key: Name, Value: !Sub "lanes-${AppName}-journal" }
        - { Key: lanes-app, Value: !Ref AppName }
        - { Key: lanes-journal, Value: !Ref AppName }

  # Snapshots of the journal's volume. A snapshot is crash-consistent, what a loss of power
  # leaves, which is what the journal is built to start from.
  SnapshotRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Lets Data Lifecycle Manager snapshot the Lanes journal volume.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: dlm.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSDataLifecycleManagerServiceRole

  SnapshotPolicy:
    Type: AWS::DLM::LifecyclePolicy
    Properties:
      Description: !Sub "Snapshots of the journal of the Lanes application ${AppName}"
      State: ENABLED
      ExecutionRoleArn: !GetAtt SnapshotRole.Arn
      PolicyDetails:
        PolicyType: EBS_SNAPSHOT_MANAGEMENT
        ResourceTypes: [VOLUME]
        TargetTags:
          - { Key: lanes-journal, Value: !Ref AppName }
        Schedules:
          - Name: !Sub "every ${SnapshotIntervalHours} h"
            CopyTags: true
            TagsToAdd:
              - { Key: lanes-snapshot, Value: !Ref AppName }
            CreateRule:
              Interval: !Ref SnapshotIntervalHours
              IntervalUnit: HOURS
              Times: ["03:17"]
            RetainRule:
              Count: !Ref SnapshotRetainCount

  # Releases: s3://<bucket>/<prefix>/releases/<commit>/<binary>, and <prefix>/current, the
  # commit and SHA-256 of the release last deployed, which a new instance starts.
  ReleaseStore:
    Type: AWS::S3::Bucket
    Condition: CreateReleaseBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
      Tags:
        - { Key: lanes-app, Value: !Ref AppName }

  ReleaseStorePolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateReleaseBucket
    Properties:
      Bucket: !Ref ReleaseStore
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ReleaseStore.Arn
              - !Sub "${ReleaseStore.Arn}/*"
            Condition:
              Bool: { aws:SecureTransport: "false" }

  # Media: uploaded by the browser with a presigned PUT and read with a presigned GET, never
  # public. Kept when the stack is deleted.
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      CorsConfiguration:
        CorsRules:
          - Id: presigned-from-the-site
            AllowedOrigins: [!Sub "https://${DomainName}"]
            AllowedMethods: [PUT, GET, HEAD]
            AllowedHeaders: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 2 }
      Tags:
        - { Key: lanes-app, Value: !Ref AppName }

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt MediaBucket.Arn
              - !Sub "${MediaBucket.Arn}/*"
            Condition:
              Bool: { aws:SecureTransport: "false" }

  MediaAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: !Sub "Read and write the media of the Lanes application ${AppName}"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:AbortMultipartUpload
              - s3:ListMultipartUploadParts
            Resource: !Sub "${MediaBucket.Arn}/*"
          - Effect: Allow
            Action: [s3:ListBucket, s3:ListBucketMultipartUploads]
            Resource: !GetAtt MediaBucket.Arn

  # Only for an S3 client that reads AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY: the user's
  # access key, made by hand, goes in /etc/lanes/secrets.env on the instance (docs/DEPLOY.md).
  # The instance role's credentials, from the metadata service, need none.
  MediaUserAccount:
    Type: AWS::IAM::User
    Condition: CreateMediaUser
    Properties:
      ManagedPolicyArns: [!Ref MediaAccessPolicy]
      Tags:
        - { Key: lanes-app, Value: !Ref AppName }

  # The instance's configuration, read at setup and by `app-instance.sh configure`, so that a
  # stack update changes no user data (which would stop the instance and do nothing).
  ConfigParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/lanes/${AppName}/config"
      Type: String
      Description: !Sub "The configuration of the Lanes application ${AppName}, read by app-instance.sh"
      Value: !Sub
        - |
          APP=${AppName}
          BINARY=${BinaryName}
          ARGS=${AppArguments}
          PORT=${AppPort}
          READY_PATH=${HealthCheckPath}
          METRICS_PATH=${MetricsPath}
          DRAIN_SECONDS=${DrainSeconds}
          RELEASES=s3://${Bucket}/${Prefix}
          LOG_GROUP=${AppLogGroup}
          METRICS_LOG_GROUP=${MetricsLogGroup}
          METRICS_NAMESPACE=Lanes/${AppName}
          SCRIPT_URL=https://raw.githubusercontent.com/${ScriptRepository}/${ScriptRef}/infra/app/app-instance.sh
          SCRIPT_SHA256=${ScriptSha256}
          DB_HOST=${DbHost}
          DB_PORT=${DbPort}
          DB_NAME=${DbName}
          DB_SECRET=${DbSecret}
          MAIL_IDENTITY=${MailIdentity}
          MEDIA_BUCKET=${MediaBucket}
        - Bucket: !If [CreateReleaseBucket, !Ref ReleaseStore, !Ref ReleaseBucket]
          Prefix: !If [DefaultPrefix, !Ref AppName, !Ref ReleasePrefix]
          DbHost: !If [HasDatabase, !GetAtt Database.Endpoint.Address, ""]
          DbPort: !If [HasDatabase, !GetAtt Database.Endpoint.Port, ""]
          DbName: !If [HasDatabase, lanes, ""]
          DbSecret: !If [HasDatabase, !Ref DatabaseSecret, ""]

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/lanes/${AppName}"
      RetentionInDays: !Ref LogRetentionDays

  MetricsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/lanes/${AppName}/prometheus"
      RetentionInDays: 7

  # What the instance may do, and nothing else: read its releases, read and write the media,
  # write its logs and metrics, attach its own journal volume to itself, be reached by Systems
  # Manager, read the database's password, and send email from its SES identity. The
  # application takes these credentials from the metadata service (IMDSv2) and refreshes them.
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub "The instance of the Lanes application ${AppName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
        - !Ref MediaAccessPolicy
      Policies:
        - PolicyName: read-the-releases
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub
                  - "arn:${AWS::Partition}:s3:::${Bucket}/${Prefix}/*"
                  - Bucket: !If [CreateReleaseBucket, !Ref ReleaseStore, !Ref ReleaseBucket]
                    Prefix: !If [DefaultPrefix, !Ref AppName, !Ref ReleasePrefix]
              # Without it a missing release reads as 403, not 404.
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub
                  - "arn:${AWS::Partition}:s3:::${Bucket}"
                  - Bucket: !If [CreateReleaseBucket, !Ref ReleaseStore, !Ref ReleaseBucket]
                Condition:
                  StringLike:
                    s3:prefix: !Sub
                      - "${Prefix}/*"
                      - Prefix: !If [DefaultPrefix, !Ref AppName, !Ref ReleasePrefix]
        - PolicyName: logs-and-metrics
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource:
                  - !GetAtt AppLogGroup.Arn
                  - !GetAtt MetricsLogGroup.Arn
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: !Sub "Lanes/${AppName}"
        - PolicyName: attach-the-journal-volume
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ec2:DescribeVolumes
                Resource: "*"
              - Effect: Allow
                Action: ec2:AttachVolume
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/${JournalVolume}
              # Only to the instance the request comes from.
              - Effect: Allow
                Action: ec2:AttachVolume
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    aws:ARN: "${ec2:SourceInstanceARN}"
        - !If
          - HasDatabase
          - PolicyName: read-the-database-password
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref DatabaseSecret
          - !Ref AWS::NoValue
        - !If
          - HasMailIdentity
          - PolicyName: send-email
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: ses:SendEmail
                  Resource: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${MailIdentity}"
          - !Ref AWS::NoValue

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # The shard. One instance: see docs/decisions/ on the deployment's shape.
  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !If [HasImage, !Ref ImageId, !Ref LatestUbuntuImage]
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !If [HasKey, !Ref KeyName, !Ref AWS::NoValue]
      SubnetId: !Ref PublicSubnetA
      SecurityGroupIds: [!GetAtt InstanceSecurityGroup.GroupId]
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
        HttpEndpoint: enabled
        InstanceMetadataTags: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref RootVolumeSize
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - { Key: Name, Value: !Sub "lanes-${AppName}" }
        - { Key: lanes-app, Value: !Ref AppName }
        # The volume this instance mounts, read from the instance's metadata at every boot.
        - { Key: lanes-journal-volume, Value: !Ref JournalVolume }
      # First boot only; app-instance.sh installs the units that run at every boot.
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -euo pipefail
            exec >>/var/log/lanes-setup.log 2>&1
            curl -fsSL --retry 5 -o /root/app-instance.sh \
              "https://raw.githubusercontent.com/${ScriptRepository}/${ScriptRef}/infra/app/app-instance.sh"
            if [ -n "${ScriptSha}" ]; then echo "${ScriptSha}  /root/app-instance.sh" | sha256sum -c -; fi
            CONFIG_PARAMETER=${ConfigParameter} AWS_REGION=${AWS::Region} bash /root/app-instance.sh setup
          - ScriptSha: !If [HasScriptSha, !Ref ScriptSha256, ""]

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!GetAtt LoadBalancerSecurityGroup.GroupId]
      LoadBalancerAttributes:
        # Below the application's ServerConfig.idle_ms (docs/DEPLOY.md), so that the
        # application never closes a connection the load balancer is about to reuse.
        - { Key: idle_timeout.timeout_seconds, Value: "60" }
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }
        - { Key: routing.http.desync_mitigation_mode, Value: strictest }
      Tags:
        - { Key: lanes-app, Value: !Ref AppName }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Protocol: HTTP
      ProtocolVersion: HTTP1
      Port: !Ref AppPort
      TargetType: instance
      Targets:
        - Id: !Ref AppInstance
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: !Ref DrainSeconds }
      Tags:
        - { Key: lanes-app, Value: !Ref AppName }

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: CreateCertificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions: !If
        - ValidateInZone
        - - DomainName: !Ref DomainName
            HostedZoneId: !Ref HostedZoneId
        - !Ref AWS::NoValue

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !If [CreateCertificate, !Ref Certificate, !Ref CertificateArn]
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # The metrics page is for the agent on the machine, not for the internet.
  HideMetrics:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: HasMetrics
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 1
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values: [!Ref MetricsPath, !Sub "${MetricsPath}/*"]
      Actions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "404"
            ContentType: text/plain
            MessageBody: "not found\n"

  SiteRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID

  # Deploys: what the repository's workflow assumes through GitHub's OIDC provider. It may put
  # releases under the prefix and run the deploy document on the instance, nothing else.
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      TargetType: /AWS::EC2::Instance
      Content:
        schemaVersion: "2.2"
        description: >-
          Deploy a release of the Lanes application, roll back to the one before, or read the
          configuration again (infra/app/app-instance.sh).
        parameters:
          Action:
            type: String
            allowedValues: [deploy, rollback, configure]
          Release:
            type: String
            default: ""
            allowedPattern: "^([0-9a-f]{40}([0-9a-f]{24})?)?$"
          Sha256:
            type: String
            default: ""
            allowedPattern: "^([0-9a-f]{64})?$"
        mainSteps:
          - action: aws:runShellScript
            name: lanes
            inputs:
              timeoutSeconds: "900"
              runCommand:
                - /opt/lanes/app-instance.sh {{Action}} {{Release}} {{Sha256}}
      Tags:
        - { Key: lanes-app, Value: !Ref AppName }

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub "Assumed by ${GitHubRepository}'s deploy workflow on ${DeployBranch} to deploy the Lanes application ${AppName}"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateOidcProvider, !GetAtt GitHubOidcProvider.Arn, !Ref ExistingOidcProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !If
                  - SubjectById
                  - !Sub
                    - "repo:${Owner}@${GitHubOwnerId}/${Name}@${GitHubRepositoryId}:ref:refs/heads/${DeployBranch}"
                    - Owner: !Select [0, !Split ["/", !Ref GitHubRepository]]
                      Name: !Select [1, !Split ["/", !Ref GitHubRepository]]
                  - !Sub "repo:${GitHubRepository}:ref:refs/heads/${DeployBranch}"
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub
                  - "arn:${AWS::Partition}:s3:::${Bucket}/${Prefix}/*"
                  - Bucket: !If [CreateReleaseBucket, !Ref ReleaseStore, !Ref ReleaseBucket]
                    Prefix: !If [DefaultPrefix, !Ref AppName, !Ref ReleasePrefix]
              - Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${DeployDocument}
              - Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    ssm:resourceTag/lanes-app: !Ref AppName
              - Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations, ec2:DescribeInstances]
                Resource: "*"

  # Alarms. The recovery alarm moves the instance to other hardware when AWS's own checks of the
  # host fail; the instance keeps its id, its addresses and its volumes.
  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
    Properties:
      Subscription:
        - { Protocol: email, Endpoint: !Ref AlarmEmail }

  RecoverInstance:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub "The host of the Lanes application ${AppName} failed AWS's checks: the instance is recovered"
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_System
      Dimensions:
        - { Name: InstanceId, Value: !Ref AppInstance }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions: !If
        - HasAlarmEmail
        - [!Sub "arn:${AWS::Partition}:automate:${AWS::Region}:ec2:recover", !Ref AlarmTopic]
        - [!Sub "arn:${AWS::Partition}:automate:${AWS::Region}:ec2:recover"]

  NoHealthyTarget:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmEmail
    Properties:
      AlarmDescription: !Sub "The site of the Lanes application ${AppName} has had no healthy target for three minutes"
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
        - { Name: TargetGroup, Value: !GetAtt TargetGroup.TargetGroupFullName }
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  JournalDiskFilling:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmEmail
    Properties:
      AlarmDescription: !Sub "The journal's volume of the Lanes application ${AppName} is over 80% full"
      Namespace: !Sub "Lanes/${AppName}"
      MetricName: disk_used_percent
      Dimensions:
        - { Name: path, Value: /srv/lanes }
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  # PostgreSQL, if asked for: in private subnets, reached only from the instance.
  DatabaseSubnetA:
    Type: AWS::EC2::Subnet
    Condition: HasDatabase
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [8, !Cidr [!Ref VpcCidr, 16, 8]]
      Tags:
        - { Key: Name, Value: !Sub "lanes-${AppName}-database-a" }

  DatabaseSubnetB:
    Type: AWS::EC2::Subnet
    Condition: HasDatabase
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [9, !Cidr [!Ref VpcCidr, 16, 8]]
      Tags:
        - { Key: Name, Value: !Sub "lanes-${AppName}-database-b" }

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Condition: HasDatabase
    Properties:
      DBSubnetGroupDescription: !Sub "The database of the Lanes application ${AppName}"
      SubnetIds: [!Ref DatabaseSubnetA, !Ref DatabaseSubnetB]

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: HasDatabase
    Properties:
      GroupDescription: !Sub "Lanes ${AppName} database - PostgreSQL from the instance only"
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !GetAtt InstanceSecurityGroup.GroupId
          Description: the application's instance

  # The Lanes PostgreSQL client speaks plain TCP (docs/decisions/D68), and RDS refuses that from
  # PostgreSQL 15 on unless told otherwise; the traffic stays inside the VPC.
  DatabaseParameters:
    Type: AWS::RDS::DBParameterGroup
    Condition: HasDatabase
    Properties:
      Description: !Sub "The database of the Lanes application ${AppName}: TLS not required"
      Family: !Sub "postgres${DatabaseEngineVersion}"
      Parameters:
        rds.force_ssl: "0"

  # Kept with the database's final snapshot, which it opens.
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Condition: HasDatabase
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub "The database password of the Lanes application ${AppName}"
      GenerateSecretString:
        SecretStringTemplate: '{"username": "lanes"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: "\"@/\\ '"

  Database:
    Type: AWS::RDS::DBInstance
    Condition: HasDatabase
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: !Ref DatabaseEngineVersion
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: !Ref DatabaseStorage
      StorageType: gp3
      StorageEncrypted: true
      DBName: lanes
      MasterUsername: lanes
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      DBParameterGroupName: !Ref DatabaseParameters
      VPCSecurityGroups: [!GetAtt DatabaseSecurityGroup.GroupId]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      CopyTagsToSnapshot: true
      DeletionProtection: true
      AutoMinorVersionUpgrade: true
      Tags:
        - { Key: lanes-app, Value: !Ref AppName }

Outputs:
  Url:
    Description: The site.
    Value: !Sub "https://${DomainName}"
  LoadBalancerDns:
    Description: Point DomainName here (a CNAME, or an alias) when the stack has no HostedZoneId.
    Value: !GetAtt LoadBalancer.DNSName
  GitHubVariable:
    Description: The repository variable LANES_DEPLOY, for the deploy workflow.
    Value: !Sub
      - '{"role":"${DeployRole.Arn}","region":"${AWS::Region}","app":"${AppName}","binary":"${BinaryName}","releases":"s3://${Bucket}/${Prefix}","document":"${DeployDocument}","ready":"https://${DomainName}${HealthCheckPath}"}'
      - Bucket: !If [CreateReleaseBucket, !Ref ReleaseStore, !Ref ReleaseBucket]
        Prefix: !If [DefaultPrefix, !Ref AppName, !Ref ReleasePrefix]
  InstanceId:
    Description: The instance; it changes when the instance is replaced.
    Value: !Ref AppInstance
  ImageId:
    Description: The AMI the instance runs; put it in the ImageId parameter to keep it.
    Value: !If [HasImage, !Ref ImageId, !Ref LatestUbuntuImage]
  JournalVolumeId:
    Description: The journal's volume.
    Value: !Ref JournalVolume
  MediaBucketName:
    Description: The media bucket.
    Value: !Ref MediaBucket
  MediaUserName:
    Condition: CreateMediaUser
    Description: The IAM user whose access key the S3 client reads from the environment.
    Value: !Ref MediaUserAccount
  LogGroup:
    Description: The application's log lines (JSON access log included).
    Value: !Ref AppLogGroup
  DeployDocumentName:
    Description: The Systems Manager document that deploys, rolls back and configures.
    Value: !Ref DeployDocument
  DatabaseEndpoint:
    Condition: HasDatabase
    Description: The database's host name.
    Value: !GetAtt Database.Endpoint.Address
  DatabaseSecretArn:
    Condition: HasDatabase
    Description: The secret holding the database's user name and password.
    Value: !Ref DatabaseSecret
