name = "lanesBench"
version = "0.1.0"
defaultTargets = ["benchStd", "benchTcp", "benchLanes", "benchMany", "benchMixed"]

[[require]]
name = "lanes"
path = ".."

# `Std.Http.Server` answering every request with a constant, no Lanes.
[[lean_exe]]
name = "benchStd"
root = "StdHello"

# `Std.Net` TCP and a hand-written HTTP/1.1 response loop, no `Std.Http`.
[[lean_exe]]
name = "benchTcp"
root = "TcpHello"

# `Lanes.Http.serve` with one actor that answers each request.
[[lean_exe]]
name = "benchLanes"
root = "LanesHello"

# `Lanes.Http.serve` with K counters, each request to one of them, optionally with work per step.
[[lean_exe]]
name = "benchMany"
root = "LanesMany"

# Mixed step costs at p99: the runtime on one worker and on several, closed loop.
[[lean_exe]]
name = "benchMixed"
root = "Mixed"
