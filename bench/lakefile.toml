name = "lanesBench"
version = "0.1.0"
defaultTargets = ["benchStd", "benchTcp", "benchLanes", "benchMany"]

[[require]]
name = "lanes"
path = ".."

# `Std.Http.Server` answering every request with a constant, no Lanes.
[[lean_exe]]
name = "benchStd"
root = "StdHello"

# `Std.Net` TCP and a hand-written HTTP/1.1 response loop, no `Std.Http`.
[[lean_exe]]
name = "benchTcp"
root = "TcpHello"

# `Lanes.Http.serve` with one actor that answers each request.
[[lean_exe]]
name = "benchLanes"
root = "LanesHello"

# `Lanes.Http.serve` with K counters, each request to one of them, optionally with work per step.
[[lean_exe]]
name = "benchMany"
root = "LanesMany"

# The kernel alone: Kernel.runWaves on K counters, with work per step, on 1 or more workers.
[[lean_exe]]
name = "benchWaves"
root = "Waves"

# The shell alone, parallel off, on and auto, on trivial, heavy, narrow and wide steps.
[[lean_exe]]
name = "benchAuto"
root = "Auto"
