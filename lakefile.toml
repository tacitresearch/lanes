name = "lanes"
version = "0.1.0"
defaultTargets = ["Lanes", "Examples", "Tests", "lanes"]
testDriver = "lanesTest"

[[require]]
name = "cslib"
git = "https://github.com/leanprover/cslib"
rev = "910210f7d155e22a2244591e394bd16fbb0ddbb3"

[[lean_lib]]
name = "Lanes"
roots = ["Lanes", "Lanes.Semantics"]

[[lean_lib]]
name = "Examples"

[[lean_lib]]
name = "Tests"
globs = ["Tests.+"]

[[lean_exe]]
name = "lanesTest"
root = "Tests.Main"

[[lean_exe]]
name = "bankWeb"
root = "Examples.BankWeb"

[[lean_lib]]
name = "LanesCli"
globs = ["LanesCli.+"]

# The `lanes` command.
[[lean_exe]]
name = "lanes"
root = "LanesCli.Main"
