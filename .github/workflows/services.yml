name: Services

# The service oracles (oracles/README.md): the S3 client, its POST forms and multipart uploads,
# the SES adapter and SQS's calls against moto, and
# the store's adapter against PostgreSQL (the distribution's version), each run checked against
# our model of the service. Then the live tests that skip without a PostgreSQL, against one with
# TLS: `lake test` (the client, its TLS and pool, the jobs worker), the to-do list's typed store
# (todoLive) and the reminders' outbox. They start services and take longer than a pull request
# should wait, so they run nightly on the default branch and by hand; the pure oracles run in
# ci.yml. Each run's records are kept as
# the workflow's artifact: copy them over oracles/moto/*.jsonl and oracles/postgres/*.jsonl to
# update what `lake test` checks.

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: services-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runner:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.runner.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
      - id: runner
        uses: ./.github/actions/runner
        with:
          runner: ${{ vars.LANES_RUNNER }}

  services:
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.label) }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - uses: ./.github/actions/lean
      - name: PostgreSQL, and Python's venv for moto
        run: |
          if ! ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1; then
            sudo apt-get update -q && sudo apt-get install -yq postgresql
          fi
          if ! python3 -m venv --help >/dev/null 2>&1; then
            sudo apt-get update -q && sudo apt-get install -yq python3-venv
          fi
      - name: Build
        run: lake build lanesServiceOracle
      - name: The store model against PostgreSQL
        run: oracles/postgres/run.sh --record
      - name: Build the live tests and the examples on PostgreSQL
        run: |
          lake build lanesTest lanesStopChild
          (cd examples/todo-db && lake build todoLive)
          (cd examples/reminders && lake build)
      # scripts/with-postgres sets LANES_POSTGRES, LANES_POSTGRES_TLS and LANES_POSTGRES_CERTS;
      # todoLive reads libpq's variables, and goes over TLS with the certificate verified.
      - name: The live tests against PostgreSQL
        env:
          LIVE: |
            lake test
            cd examples/todo-db
            PGHOST=localhost PGPORT="${LANES_POSTGRES#*:}" PGUSER=lanes_scram PGPASSWORD=scram-pw \
              PGDATABASE=lanes_test PGSSLMODE=verify-full PGSSLROOTCERT="$LANES_POSTGRES_CERTS/ca.pem" \
              lake exe todoLive
            cd ../reminders
            lake test
        run: scripts/with-postgres --tls bash -euo pipefail -c "$LIVE"
      - name: The object store, multipart, email and queue models against moto
        run: oracles/moto/run.sh --record
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-records
          path: |
            oracles/moto/*.jsonl
            oracles/postgres/*.jsonl
