name: CI

# Jobs that build run on `vars.LANES_RUNNER` (a label or a JSON list of labels), or on
# ubuntu-latest when it is unset; a pull request from a fork always runs on ubuntu-latest. See
# docs/RUNNERS.md. `build` builds everything once; the other jobs restore its build and run in
# parallel.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runner:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.runner.outputs.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - id: runner
        uses: ./.github/actions/runner
        with:
          runner: ${{ vars.LANES_RUNNER }}

  # Order follows LANES_STYLE section 6: build, lint, model checks and tests.
  build:
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.label) }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - id: lean
        uses: ./.github/actions/lean
      - name: Build
        run: lake build --wfail
      - if: steps.lean.outputs.packages-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/packages
          key: ${{ steps.lean.outputs.packages-key }}
      - uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: ${{ steps.lean.outputs.build-key }}
      - name: Lint
        run: lake exe lanes lint

  check:
    needs: [runner, build]
    runs-on: ${{ fromJSON(needs.runner.outputs.label) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lean
      - name: Model checks
        run: lake exe lanesCheck

  test:
    needs: [runner, build]
    runs-on: ${{ fromJSON(needs.runner.outputs.label) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lean
      - name: Test
        run: lake test
      - name: Generated app builds and passes its checks
        run: |
          lake exe lanes new demo-app --dir "$RUNNER_TEMP/demo-app" --lanes-path "$GITHUB_WORKSPACE"
          cd "$RUNNER_TEMP/demo-app"
          mkdir -p .lake && ln -sfn "$GITHUB_WORKSPACE/.lake/packages" .lake/packages
          lake build
          lake test

  raft-kv:
    needs: [runner, build]
    runs-on: ${{ fromJSON(needs.runner.outputs.label) }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: systems/raft-kv
    steps:
      - uses: actions/checkout@v4
      - id: lean
        uses: ./.github/actions/lean
        with:
          system: raft-kv
      - name: Build
        run: lake build
      - uses: actions/cache/save@v4
        with:
          path: systems/raft-kv/.lake/build
          key: ${{ steps.lean.outputs.system-key }}
      - name: Model checks
        run: lake test
      - name: Three nodes over TCP
        run: lake exe raftLive
      - name: Three node processes, killed and started again
        run: lake exe raftProcs

  ledger:
    needs: [runner, build]
    runs-on: ${{ fromJSON(needs.runner.outputs.label) }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: systems/ledger
    steps:
      - uses: actions/checkout@v4
      - id: lean
        uses: ./.github/actions/lean
        with:
          system: ledger
      - name: Build
        run: lake build
      - uses: actions/cache/save@v4
        with:
          path: systems/ledger/.lake/build
          key: ${{ steps.lean.outputs.system-key }}
      - name: Model checks
        run: lake test
      - name: Over HTTP, killed and started again
        run: lake exe ledgerLive
