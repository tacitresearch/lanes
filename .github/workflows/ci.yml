name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: libsodium, which Lanes links
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev pkg-config
      # Installs elan and the pinned toolchain, fetches the Mathlib cache, then builds and tests.
      # Order follows LANES_STYLE section 6: build, lint, model checks and tests.
      - uses: leanprover/lean-action@v1
        with:
          build-args: "--wfail"
          test: false
      # Also fails on a stale generated file (line counts, the decisions' index, docs/STATUS.md),
      # and on main on a decision without a number: run `lake exe lanes lint --fix --main`.
      - name: Lint
        run: lake exe lanes lint ${{ github.event_name == 'push' && '--main' || '' }}
      - name: lanes lint --fix changes nothing
        run: |
          lake exe lanes lint --fix
          git diff --exit-code
      - name: Test
        run: lake test
      - name: Model checks
        run: lake exe lanesCheck
      - name: Generated app builds and passes its checks
        run: |
          rm -f .lake/build/lib/lean/LanesCli/New.* .lake/build/ir/LanesCli/New.*
          lake exe lanes new demo-app --dir "$RUNNER_TEMP/demo-app" --lanes-path "$GITHUB_WORKSPACE"
          cd "$RUNNER_TEMP/demo-app"
          mkdir -p .lake && ln -s "$GITHUB_WORKSPACE/.lake/packages" .lake/packages
          lake build
          lake test
      - name: systems/raft-kv builds and passes its checks
        run: |
          cd systems/raft-kv
          mkdir -p .lake && ln -s "$GITHUB_WORKSPACE/.lake/packages" .lake/packages
          lake build
          lake test
          lake exe raftLive
          lake exe raftProcs
      - name: systems/ledger builds and passes its checks
        run: |
          cd systems/ledger
          mkdir -p .lake && ln -s "$GITHUB_WORKSPACE/.lake/packages" .lake/packages
          lake build
          lake test
          lake exe ledgerLive
