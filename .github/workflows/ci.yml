name: CI

# Jobs that build run on `vars.LANES_RUNNER` (a label or a JSON list of labels), or on
# ubuntu-latest when it is unset; a pull request from a fork always runs on ubuntu-latest. CI
# does not start the warm runner machine (mutants.yml does): point LANES_RUNNER at it only while
# it is kept running. See infra/README.md. `compile` builds everything once; the other jobs
# restore its build and run in parallel.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runner:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.runner.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
      - id: runner
        uses: ./.github/actions/runner
        with:
          runner: ${{ vars.LANES_RUNNER }}

  # Whether the change touches anything but prose: when a pull request or a merge queue's group
  # changes only documentation, `compile` still builds and lints (the lint checks the docs' links,
  # the generated files and the decisions), and the other jobs are skipped. A push to main and a
  # run by hand check everything. `docs/TUTORIAL.md` and `docs/TUTORIAL-WEB.md` are run by
  # `lake test`, and `examples/counter`'s Markdown must match `templates/app`, so they are code.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          case "$EVENT" in
            pull_request) changed=$(git diff --name-only "$PR_BASE...$PR_HEAD") ;;
            merge_group) changed=$(git diff --name-only "$MQ_BASE" "$MQ_HEAD") ;;
            *) echo "code=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          prose='^(docs/.*|.*\.md|\.github/ISSUE_TEMPLATE/.*|LICENSE|.*\.(png|svg|jpg))$'
          code='^(docs/TUTORIAL(-WEB)?\.md|examples/counter/.*|templates/.*)$'
          if [ -n "$changed" ] && ! grep -vE "$prose" <<<"$changed" | grep -q . \
              && ! grep -qE "$code" <<<"$changed"; then
            echo "Only documentation changed: the jobs after compile are skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  # Order follows AGENTS.md, "Build and checks": build, lint, model checks and tests.
  compile:
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.label) }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - id: lean
        uses: ./.github/actions/lean
      - name: Build
        run: lake build --wfail
      # The Actions caches of `.lake/build` stay what jobs start from. Lake's artifact cache is
      # the job's own and starts empty (.github/actions/lean), so that `--wfail` sees every
      # warning. A remote cache (D99, section 6; #98) would be filled here, with `lake build -o`
      # and `lake cache put`. There is none yet.
      - name: native/tls.c declares OpenSSL as its headers do
        run: python3 scripts/tls-declarations.py
      - if: steps.lean.outputs.packages-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/packages
          key: ${{ steps.lean.outputs.packages-key }}
      - if: steps.lean.outputs.warm != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: ${{ steps.lean.outputs.build-key }}
      # Also fails on a stale generated file (line counts, the decisions' index),
      # and on main on a decision without a number: run `lake exe lanes lint --fix --main`.
      - name: Lint
        run: lake exe lanes lint ${{ github.event_name == 'push' && '--main' || '' }}
      - name: lanes lint --fix changes nothing
        run: |
          lake exe lanes lint --fix
          git diff --exit-code
      # The totals no committed file holds, since each would change with every item.
      - name: Totals
        run: lake exe lanes stats >> "$GITHUB_STEP_SUMMARY"

  check:
    needs: [runner, changes, compile]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(needs.runner.outputs.label) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - uses: ./.github/actions/lean
      - name: Model checks
        run: lake exe lanesCheck

  oracle:
    needs: [runner, changes, compile]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(needs.runner.outputs.label) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - uses: ./.github/actions/lean
      # The pure oracles (oracles/README.md): our parsers and encoders against Go's standard
      # library, expfmt, botocore and jwcrypto on generated inputs. Go fetches the toolchain
      # `oracles/go/go.mod` pins; the Python references get virtual environments made from their
      # requirements.txt. It fails only on a difference no decision covers. The service
      # oracles run in services.yml.
      - name: Python's venv, for the Python references
        run: |
          if python3 -m venv --help >/dev/null 2>&1; then exit 0; fi
          sudo apt-get update -q && sudo apt-get install -yq python3-venv
      - name: The references, fixed seed
        run: lake exe lanesOracle --cases 20000
      - name: The references, a new seed each run
        run: lake exe lanesOracle --cases 20000 --seed ${{ github.run_id }}
      - name: SES's address check against net/mail
        run: |
          mkdir -p integrations/aws/.lake
          ln -sfn "$GITHUB_WORKSPACE/.lake/packages" integrations/aws/.lake/packages
          cd integrations/aws
          lake exe oracle --cases 20000
          lake exe oracle --cases 20000 --seed ${{ github.run_id }}

  test:
    needs: [runner, changes, compile]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(needs.runner.outputs.label) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - uses: ./.github/actions/lean
      - name: Test
        run: lake test
      - name: Generated app builds and passes its checks
        run: |
          lake exe lanes new demo-app --dir "$RUNNER_TEMP/demo-app" --lanes-path "$GITHUB_WORKSPACE"
          cd "$RUNNER_TEMP/demo-app"
          mkdir -p .lake && ln -sfn "$GITHUB_WORKSPACE/.lake/packages" .lake/packages
          lake build
          lake test

  # The integrations and the small examples, each a package of its own: built with their proofs,
  # and their checks run, in three groups at once. Their builds are kept in the Actions cache,
  # keyed on the toolchain, the manifests and the sources, so a run rebuilds only what changed;
  # the cache is saved once they are built, before their checks run.
  examples:
    needs: [runner, changes, compile]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(needs.runner.outputs.label) }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: small
            packages: >-
              integrations/google integrations/github integrations/aws examples/counter
              examples/bank examples/bank-web examples/kv-cache examples/election examples/watchdog
          - group: web
            packages: >-
              examples/payments examples/migration examples/todo-db examples/sign-in
              examples/upload examples/reminders
          - group: videos
            packages: examples/videos
    name: examples (${{ matrix.group }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - id: lean
        uses: ./.github/actions/lean
      # On a machine of our own (`warm`) the work directory keeps the builds instead.
      - id: keys
        if: steps.lean.outputs.warm != 'true'
        env:
          ROOT: ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/*/lake-manifest.json', 'integrations/*/lake-manifest.json') }}
          SOURCES: ${{ hashFiles('lakefile.lean', 'Lanes/**', 'native/**', 'examples/**/*.lean', 'examples/**/lakefile.*', 'integrations/**/*.lean', 'integrations/**/lakefile.*', '!**/.lake/**') }}
        run: |
          echo "prefix=lake-examples-${{ matrix.group }}-$ROOT-" >> "$GITHUB_OUTPUT"
          echo "key=lake-examples-${{ matrix.group }}-$ROOT-$SOURCES" >> "$GITHUB_OUTPUT"
      - id: built
        if: steps.lean.outputs.warm != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            examples/*/.lake/build
            integrations/*/.lake/build
          key: ${{ steps.keys.outputs.key }}
          restore-keys: ${{ steps.keys.outputs.prefix }}
      - name: Build each package
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          for package in $PACKAGES; do
            echo "::group::$package"
            mkdir -p "$package/.lake"
            ln -sfn "$GITHUB_WORKSPACE/.lake/packages" "$package/.lake/packages"
            (cd "$package" && lake build --wfail)
            echo "::endgroup::"
          done
      - if: steps.lean.outputs.warm != 'true' && steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            examples/*/.lake/build
            integrations/*/.lake/build
          key: ${{ steps.keys.outputs.key }}
      # A package that pins the schemas of its files (`schemas/`) is linted too: lint `schema`
      # reads its build and the corpus its pinned files name.
      - name: Check each package
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          for package in $PACKAGES; do
            echo "::group::$package"
            (cd "$package" && time lake test)
            if [ -d "$package/schemas" ]; then (cd "$package" && lake exe lanes lint); fi
            echo "::endgroup::"
          done

  raft-kv:
    needs: [runner, changes, compile]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(needs.runner.outputs.label) }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: examples/raft-kv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - id: lean
        uses: ./.github/actions/lean
        with:
          system: raft-kv
      - name: Build
        run: lake build
      - if: steps.lean.outputs.warm != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: examples/raft-kv/.lake/build
          key: ${{ steps.lean.outputs.system-key }}
      - name: Model checks
        run: lake test
      - name: Three nodes over TCP
        run: lake exe raftLive
      - name: Three node processes, killed and started again
        run: lake exe raftProcs

  ledger:
    needs: [runner, changes, compile]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(needs.runner.outputs.label) }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: examples/ledger
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - id: lean
        uses: ./.github/actions/lean
        with:
          system: ledger
      - name: Build
        run: lake build
      - if: steps.lean.outputs.warm != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: examples/ledger/.lake/build
          key: ${{ steps.lean.outputs.system-key }}
      - name: Model checks
        run: lake test
      - name: Over HTTP, killed and started again
        run: lake exe ledgerLive

  rookery:
    needs: [runner, changes, compile]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(needs.runner.outputs.label) }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: examples/rookery
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - id: lean
        uses: ./.github/actions/lean
        with:
          system: rookery
      - name: Build
        run: lake build --wfail
      - if: steps.lean.outputs.warm != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: examples/rookery/.lake/build
          key: ${{ steps.lean.outputs.system-key }}
      - name: Model checks
        run: lake test
      - name: Over HTTP, killed and started again
        run: lake exe rookeryLive

  # What a user on a Mac does: the build, the tests and a generated app, on GitHub's runner.
  macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: lean
        uses: ./.github/actions/lean
      - name: Build
        run: lake build --wfail
      - if: steps.lean.outputs.packages-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/packages
          key: ${{ steps.lean.outputs.packages-key }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: ${{ steps.lean.outputs.build-key }}
      - name: Test
        run: lake test
      - name: Generated app builds and passes its checks
        run: |
          lake exe lanes new demo-app --dir "$RUNNER_TEMP/demo-app" --lanes-path "$GITHUB_WORKSPACE"
          cd "$RUNNER_TEMP/demo-app"
          mkdir -p .lake && ln -sfn "$GITHUB_WORKSPACE/.lake/packages" .lake/packages
          lake build
          lake test
          .lake/build/bin/demo-app 8090 & pid=$!
          for _ in $(seq 1 50); do curl -sf http://127.0.0.1:8090/count >/dev/null && break; sleep 0.2; done
          curl -sf http://127.0.0.1:8090/count
          kill "$pid"

  # The one check branch protection requires. A job that is skipped counts as passed there, so
  # this job always runs. It fails unless `changes` and `compile` succeeded and every other job
  # succeeded or was skipped: skipped because only documentation changed, since a job whose
  # needs failed is skipped too, but then a job it needs has failed.
  build:
    needs: [runner, changes, compile, check, oracle, test, examples, raft-kv, ledger, rookery, macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          python3 -c '
          import json, os, sys
          r = {job: v["result"] for job, v in json.loads(os.environ["RESULTS"]).items()}
          needed = ("runner", "changes", "compile")
          ok = all(r.get(j) == "success" for j in needed) and all(x in ("success", "skipped") for x in r.values())
          sys.exit(0 if ok else 1)'
