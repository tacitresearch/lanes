name: CI

# Jobs that build run on `vars.LANES_RUNNER` (a label or a JSON list of labels), or on
# ubuntu-latest when it is unset; a pull request from a fork always runs on ubuntu-latest. CI
# does not start the warm runner machine (mutants.yml does): point LANES_RUNNER at it only while
# it is kept running. See docs/RUNNERS.md. `compile` builds everything once; the other jobs
# restore its build and run in parallel.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runner:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.runner.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
      - id: runner
        uses: ./.github/actions/runner
        with:
          runner: ${{ vars.LANES_RUNNER }}

  # Order follows AGENTS.md, "Build and checks": build, lint, model checks and tests.
  compile:
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.label) }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - id: lean
        uses: ./.github/actions/lean
      - name: Build
        run: lake build --wfail
      - if: steps.lean.outputs.packages-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/packages
          key: ${{ steps.lean.outputs.packages-key }}
      - if: steps.lean.outputs.warm != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: ${{ steps.lean.outputs.build-key }}
      # Also fails on a stale generated file (line counts, the decisions' index, docs/STATUS.md),
      # and on main on a decision without a number: run `lake exe lanes lint --fix --main`.
      - name: Lint
        run: lake exe lanes lint ${{ github.event_name == 'push' && '--main' || '' }}
      - name: lanes lint --fix changes nothing
        run: |
          lake exe lanes lint --fix
          git diff --exit-code

  check:
    needs: [runner, compile]
    runs-on: ${{ fromJSON(needs.runner.outputs.label) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - uses: ./.github/actions/lean
      - name: Model checks
        run: lake exe lanesCheck

  oracle:
    needs: [runner, compile]
    runs-on: ${{ fromJSON(needs.runner.outputs.label) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - uses: ./.github/actions/lean
      # Our parsers against Go's standard library on generated inputs; Go fetches the toolchain
      # `oracle/go.mod` pins. It fails only on a difference no decision covers.
      - name: Against Go, fixed seed
        run: lake exe lanesOracle --cases 20000
      - name: Against Go, a new seed each run
        run: lake exe lanesOracle --cases 20000 --seed ${{ github.run_id }}

  test:
    needs: [runner, compile]
    runs-on: ${{ fromJSON(needs.runner.outputs.label) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - uses: ./.github/actions/lean
      - name: Test
        run: lake test
      - name: Generated app builds and passes its checks
        run: |
          lake exe lanes new demo-app --dir "$RUNNER_TEMP/demo-app" --lanes-path "$GITHUB_WORKSPACE"
          cd "$RUNNER_TEMP/demo-app"
          mkdir -p .lake && ln -sfn "$GITHUB_WORKSPACE/.lake/packages" .lake/packages
          lake build
          lake test

  # The small examples, each a package of its own: built with their proofs, and their checks run.
  examples:
    needs: [runner, compile]
    runs-on: ${{ fromJSON(needs.runner.outputs.label) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - uses: ./.github/actions/lean
      - name: Build and check each small example
        run: |
          for example in counter bank bank-web kv-cache election watchdog payments migration todo-db; do
            echo "::group::examples/$example"
            mkdir -p "examples/$example/.lake"
            ln -sfn "$GITHUB_WORKSPACE/.lake/packages" "examples/$example/.lake/packages"
            (cd "examples/$example" && lake build --wfail && lake test)
            echo "::endgroup::"
          done

  raft-kv:
    needs: [runner, compile]
    runs-on: ${{ fromJSON(needs.runner.outputs.label) }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: examples/raft-kv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - id: lean
        uses: ./.github/actions/lean
        with:
          system: raft-kv
      - name: Build
        run: lake build
      - if: steps.lean.outputs.warm != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: examples/raft-kv/.lake/build
          key: ${{ steps.lean.outputs.system-key }}
      - name: Model checks
        run: lake test
      - name: Three nodes over TCP
        run: lake exe raftLive
      - name: Three node processes, killed and started again
        run: lake exe raftProcs

  ledger:
    needs: [runner, compile]
    runs-on: ${{ fromJSON(needs.runner.outputs.label) }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: examples/ledger
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - id: lean
        uses: ./.github/actions/lean
        with:
          system: ledger
      - name: Build
        run: lake build
      - if: steps.lean.outputs.warm != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: examples/ledger/.lake/build
          key: ${{ steps.lean.outputs.system-key }}
      - name: Model checks
        run: lake test
      - name: Over HTTP, killed and started again
        run: lake exe ledgerLive

  rookery:
    needs: [runner, compile]
    runs-on: ${{ fromJSON(needs.runner.outputs.label) }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: examples/rookery
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - id: lean
        uses: ./.github/actions/lean
        with:
          system: rookery
      - name: Build
        run: lake build --wfail
      - if: steps.lean.outputs.warm != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: examples/rookery/.lake/build
          key: ${{ steps.lean.outputs.system-key }}
      - name: Model checks
        run: lake test
      - name: Over HTTP, killed and started again
        run: lake exe rookeryLive

  # A pull request that changes the library, the C, the command or the template changes
  # CHANGELOG.md too, unless it is labelled `no-changelog` (CONTRIBUTING.md). Pull requests only,
  # and not among `build`'s needs. The labels are those of the event: after adding the label,
  # push again (a re-run reads the same labels).
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: CHANGELOG.md changes with the code
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE...$HEAD")
          if grep -qE '^(Lanes|native|LanesCli|templates)/' <<<"$changed" && ! grep -qx 'CHANGELOG.md' <<<"$changed"; then
            echo "::error file=CHANGELOG.md::add a line under Unreleased, or label the pull request no-changelog"
            exit 1
          fi

  # What a user on a Mac does: Homebrew's libsodium (under /opt/homebrew on Apple silicon), the
  # build, the tests and a generated app, on GitHub's runner.
  macos:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: lean
        uses: ./.github/actions/lean
      - name: Build
        run: lake build --wfail
      - if: steps.lean.outputs.packages-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/packages
          key: ${{ steps.lean.outputs.packages-key }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: ${{ steps.lean.outputs.build-key }}
      - name: Test
        run: lake test
      - name: Generated app builds and passes its checks
        run: |
          lake exe lanes new demo-app --dir "$RUNNER_TEMP/demo-app" --lanes-path "$GITHUB_WORKSPACE"
          cd "$RUNNER_TEMP/demo-app"
          mkdir -p .lake && ln -sfn "$GITHUB_WORKSPACE/.lake/packages" .lake/packages
          lake build
          lake test
          .lake/build/bin/demo-app 8090 & pid=$!
          for _ in $(seq 1 50); do curl -sf http://127.0.0.1:8090/count >/dev/null && break; sleep 0.2; done
          curl -sf http://127.0.0.1:8090/count
          kill "$pid"

  # The one check branch protection requires. A job that is skipped counts as passed there, so
  # this job always runs and fails unless every job before it succeeded.
  build:
    needs: [runner, compile, check, oracle, test, examples, raft-kv, ledger, rookery, macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          python3 -c 'import json, os, sys; r = json.loads(os.environ["RESULTS"]); sys.exit(0 if r and all(x == "success" for x in r) else 1)'
