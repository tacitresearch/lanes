name: Large bounds

# The model checks at large bounds (AGENTS.md, "Build and checks"). A pull request's `lake test`
# runs every scenario at small bounds, each reaching all its witnesses; here the same scenarios
# run at the bounds that take minutes. Nightly on the default branch, and by hand.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: large-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runner:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.runner.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
      - id: runner
        uses: ./.github/actions/runner
        with:
          runner: ${{ vars.LANES_RUNNER }}

  videos:
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.label) }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: examples/videos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - id: lean
        uses: ./.github/actions/lean
        with:
          system: videos
      - name: Build
        run: lake build --wfail videosTest
      - if: steps.lean.outputs.warm != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: examples/videos/.lake/build
          key: ${{ steps.lean.outputs.system-key }}
      - name: Model checks at large bounds
        run: lake exe videosTest large
