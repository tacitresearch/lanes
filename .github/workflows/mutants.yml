name: Mutants

# The mutation gate of scripts/mutants.py, every mutant, in shards that run in parallel. Runs
# nightly on the default branch, by hand, and on a pull request that carries the label
# `mutants` (again on each push to it). Jobs that build run on `vars.LANES_RUNNER`, as in CI.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      shards:
        description: How many jobs to split the mutants among
        required: false
        default: "8"
  pull_request:
    types: [labeled, opened, synchronize, reopened]

permissions:
  contents: read

# Adding another label to a pull request starts a run that does nothing; it gets a group of its
# own so that it does not cancel the gate.
concurrency:
  group: mutants-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'mutants' && github.run_id || 'gate' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'mutants') &&
       (github.event.action != 'labeled' || github.event.label.name == 'mutants'))
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.runner.outputs.label }}
      count: ${{ steps.shards.outputs.count }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            scripts
      - id: runner
        uses: ./.github/actions/runner
        with:
          runner: ${{ vars.LANES_RUNNER }}
      - id: shards
        env:
          SHARDS: ${{ inputs.shards || '8' }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, subprocess, sys
          n = int(os.environ["SHARDS"])
          if not 1 <= n <= 64:
              sys.exit(f"shards must be from 1 to 64, not {n}")
          def names(*args):
              out = subprocess.run([sys.executable, "scripts/mutants.py", "--list", *args],
                                   capture_output=True, text=True, check=True).stdout
              return sorted(l for l in out.splitlines()
                            if l and not l.startswith(" ") and not l.endswith(" mutants"))
          parts = [names("--shard", f"{i}/{n}") for i in range(1, n + 1)]
          if sorted(sum(parts, [])) != names():
              sys.exit("the shards do not hold each mutant exactly once")
          print(f"count={n}")
          print(f"shards={json.dumps(list(range(1, n + 1)))}")
          print(f"{len(names())} mutants in {n} shards", file=sys.stderr)
          EOF

  # Builds the code as it is once and saves it, so that each shard starts from this build.
  build:
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.label) }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - id: lean
        uses: ./.github/actions/lean
        with:
          system: raft-kv
      - name: Build what the checks run
        run: |
          lake build lanesTest
          (cd systems/raft-kv && lake build raftNode raftProcs raftLive)
      - if: steps.lean.outputs.packages-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/packages
          key: ${{ steps.lean.outputs.packages-key }}
      - uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: ${{ steps.lean.outputs.build-key }}
      - uses: actions/cache/save@v4
        with:
          path: systems/raft-kv/.lake/build
          key: ${{ steps.lean.outputs.system-key }}

  shard:
    needs: [plan, build]
    runs-on: ${{ fromJSON(needs.plan.outputs.label) }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lean
        with:
          system: raft-kv
      - name: Mutants of shard ${{ matrix.shard }}
        run: >-
          python3 scripts/mutants.py --all --baseline
          --shard ${{ matrix.shard }}/${{ needs.plan.outputs.count }}
          --json verdicts-${{ matrix.shard }}.json
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: verdicts-${{ matrix.shard }}
          path: verdicts-${{ matrix.shard }}.json
          if-no-files-found: ignore

  # Fails on a mutant that survives, only hangs, is stale, or has no verdict (its shard failed
  # before it).
  verdict:
    needs: [plan, shard]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ${{ fromJSON(needs.plan.outputs.label) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: verdicts-*
          path: verdicts
          merge-multiple: true
      - name: Every mutant killed
        run: |
          shopt -s nullglob
          python3 scripts/mutants.py --collect verdicts/*.json | tee verdicts.txt
          status=${PIPESTATUS[0]}
          { echo '```'; cat verdicts.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
