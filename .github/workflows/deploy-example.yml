name: Deploy (example)

# Builds a Lanes application's executable, puts it in the release bucket under its commit, and
# has the instance of infra/app/lanes-app.yaml switch to it through Systems Manager; then waits
# for the site's readiness page through the load balancer and rolls back if it does not answer
# 200 in time. AWS is reached through GitHub's OIDC provider, with no keys stored anywhere.
#
# Run by hand only, and inert until the repository variable LANES_DEPLOY holds the stack's
# GitHubVariable output: in this repository it never runs by itself. Copy it into an
# application's own repository and set `app-dir` to `.` there (docs/DEPLOY.md).

on:
  workflow_dispatch:
    inputs:
      app-dir:
        description: The application's directory, the one with its lakefile.toml (`.` in an application's own repository).
        default: examples/counter
      ready-seconds:
        description: How long the site may take to answer 200 at its readiness page through the load balancer.
        default: "180"

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.LANES_DEPLOY != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      APP_DIR: ${{ inputs.app-dir }}
      READY_SECONDS: ${{ inputs.ready-seconds }}
      RELEASE: ${{ github.sha }}
      APP: ${{ fromJSON(vars.LANES_DEPLOY).app }}
      BINARY: ${{ fromJSON(vars.LANES_DEPLOY).binary }}
      RELEASES: ${{ fromJSON(vars.LANES_DEPLOY).releases }}
      DOCUMENT: ${{ fromJSON(vars.LANES_DEPLOY).document }}
      READY_URL: ${{ fromJSON(vars.LANES_DEPLOY).ready }}
      AWS_REGION: ${{ fromJSON(vars.LANES_DEPLOY).region }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: libsodium, which Lanes links
        run: sudo apt-get update -q && sudo apt-get install -yq libsodium-dev pkg-config
      # elan's release and the SHA-256 of its archive, as infra/ec2-runner.sh pins them.
      - name: elan and the toolchain
        env:
          ELAN_VERSION: v4.4.0
          ELAN_SHA256: 0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2
        run: |
          curl -sSfL --retry 5 -o "$RUNNER_TEMP/elan.tar.gz" \
            "https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "$ELAN_SHA256  $RUNNER_TEMP/elan.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat "$APP_DIR/lean-toolchain")"
      # The dependencies, Mathlib among them: Lake clones every package of the manifest, though
      # the executable imports none of the proof layer and builds without Mathlib's files.
      - id: packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.app-dir }}/.lake/packages
          key: deploy-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/lean-toolchain', inputs.app-dir), format('{0}/lake-manifest.json', inputs.app-dir)) }}
      - name: Build
        working-directory: ${{ inputs.app-dir }}
        run: |
          lake build "$BINARY"
          mkdir -p "$RUNNER_TEMP/release"
          strip -o "$RUNNER_TEMP/release/$BINARY" ".lake/build/bin/$BINARY"
          # Lean links its runtime, and Lanes libsodium, into the executable: only the C library
          # and the loader are left for the instance to provide.
          ldd "$RUNNER_TEMP/release/$BINARY"
          if ldd "$RUNNER_TEMP/release/$BINARY" | grep -vE 'linux-vdso|ld-linux|lib(c|m|dl|rt|pthread)\.so'; then
            echo "::error::$BINARY needs a shared library the instance may not have"
            exit 1
          fi
          sha256sum "$RUNNER_TEMP/release/$BINARY" | cut -d' ' -f1 > "$RUNNER_TEMP/release/sha256"
          echo "$BINARY $(cat "$RUNNER_TEMP/release/sha256")"
      - if: steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.app-dir }}/.lake/packages
          key: ${{ steps.packages.outputs.cache-primary-key }}
      - uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ fromJSON(vars.LANES_DEPLOY).role }}
          aws-region: ${{ fromJSON(vars.LANES_DEPLOY).region }}
      - name: Upload the release
        run: |
          aws s3 cp --only-show-errors "$RUNNER_TEMP/release/$BINARY" "$RELEASES/releases/$RELEASE/$BINARY"
      - name: Switch the instance to it
        run: |
          # $1: deploy or rollback. Waits for the command and prints what it wrote.
          run_on_instance() {
            local instance id status
            instance=$(aws ec2 describe-instances \
              --filters "Name=tag:lanes-app,Values=$APP" Name=instance-state-name,Values=running \
              --query 'Reservations[].Instances[].InstanceId' --output text)
            if [ -z "$instance" ] || [ "$(wc -w <<<"$instance")" -ne 1 ]; then
              echo "::error::not one running instance tagged lanes-app=$APP: '$instance'"
              return 1
            fi
            id=$(aws ssm send-command --document-name "$DOCUMENT" --instance-ids "$instance" \
              --comment "$1 ${RELEASE:0:12}" \
              --parameters "Action=$1,Release=$RELEASE,Sha256=$(cat "$RUNNER_TEMP/release/sha256")" \
              --query Command.CommandId --output text)
            for _ in $(seq 1 240); do
              sleep 5
              status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$instance" \
                --query Status --output text 2>/dev/null || echo Pending)
              case "$status" in Pending|InProgress|Delayed) ;; *) break ;; esac
            done
            aws ssm get-command-invocation --command-id "$id" --instance-id "$instance" \
              --query '[StandardOutputContent, StandardErrorContent]' --output text || true
            echo "$1 on $instance: $status"
            [ "$status" = Success ]
          }
          # The instance has rolled back by itself if the release was not ready there.
          run_on_instance deploy
          deadline=$(( $(date +%s) + READY_SECONDS ))
          until curl -fsS -o /dev/null --max-time 5 "$READY_URL"; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::$READY_URL did not answer 200 within $READY_SECONDS s: rolling back"
              run_on_instance rollback || true
              exit 1
            fi
            sleep 5
          done
          echo "$READY_URL answers 200"
      # What a new instance starts, written only once the site is ready.
      - name: Make it the current release
        run: |
          echo "$RELEASE $(cat "$RUNNER_TEMP/release/sha256")" \
            | aws s3 cp --only-show-errors - "$RELEASES/current"
