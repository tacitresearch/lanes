name: Lean
description: >
  Installs elan and the toolchain of `lean-toolchain`, and gives the job `.lake/packages`
  (Mathlib, prebuilt, and the other dependencies, built) and a `.lake/build` to start from, so
  Lake rebuilds only what changed. On a runner set up by infra/ec2-runner.sh (LANES_SHARED is
  set) the packages are the machine's shared ones, made once per toolchain and manifest, and
  the build is the one the job's work directory kept, or the machine's warm one. Elsewhere both
  come from the Actions cache: the packages keyed on the toolchain and the manifest (fetched with
  `lake exe cache get` when missing), the build on the commit, falling back to the newest
  earlier one. With `system`, `examples/<system>` gets the same packages and its own build back.
  Saving is left to the jobs that build, when `warm` is not true: see the keys in the outputs.
  Each job gets an empty Lake artifact cache of its own, in `.lake/cache` (AGENTS.md, "Build and
  checks"): Lake does not replay the warnings of a module it takes from that cache, so a cache
  shared with other jobs would let `--wfail` pass over a warning that another job saw.
inputs:
  system:
    description: A directory under `examples/` whose build to restore as well.
    required: false
    default: ""
outputs:
  warm:
    description: Whether the machine's shared packages are used; then nothing is to be saved.
    value: ${{ steps.shared.outputs.warm }}
  packages-hit:
    description: Whether `.lake/packages` is there for exactly this toolchain and manifest.
    value: ${{ steps.shared.outputs.warm == 'true' || steps.packages.outputs.cache-hit == 'true' }}
  packages-key:
    description: The key to save `.lake/packages` under.
    value: ${{ steps.keys.outputs.packages }}
  build-key:
    description: The key to save `.lake/build` under.
    value: ${{ steps.keys.outputs.build }}
  system-key:
    description: The key to save `examples/<system>/.lake/build` under.
    value: ${{ steps.keys.outputs.system }}
runs:
  using: composite
  steps:
    # Lanes links the OpenSSL of Lean's toolchain, so nothing is installed to build. The tests make
    # certificates and run a server with the `openssl` command (macOS has LibreSSL's), and on
    # Linux scripts/tls-declarations.py compiles native/*.c against OpenSSL's headers.
    - name: The openssl command and OpenSSL's headers, for the tests
      shell: bash
      run: |
        if [ "$RUNNER_OS" = macOS ]; then exit 0; fi
        if command -v openssl >/dev/null && pkg-config --exists openssl 2>/dev/null; then exit 0; fi
        # A machine of our own may not let the runner use sudo; what is built does not need these,
        # and the tests that do fail without them.
        if ! sudo -n true 2>/dev/null; then
          echo "::warning::the openssl command or OpenSSL's headers are missing and cannot be installed here (no sudo): the TLS tests and scripts/tls-declarations.py need them"
          exit 0
        fi
        sudo apt-get update -q && sudo apt-get install -yq openssl libssl-dev pkg-config
    - name: An empty Lake artifact cache, the job's own
      shell: bash
      run: |
        rm -rf "$GITHUB_WORKSPACE/.lake/cache"
        echo "LAKE_CACHE_DIR=$GITHUB_WORKSPACE/.lake/cache" >> "$GITHUB_ENV"
    - name: Install elan and the toolchain
      shell: bash
      run: |
        elan_home="${ELAN_HOME:-$HOME/.elan}"
        if [ ! -x "$elan_home/bin/elan" ]; then
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --no-modify-path --default-toolchain none
        fi
        echo "$elan_home/bin" >> "$GITHUB_PATH"
        # Runners on one machine share elan: one of them installs a new toolchain at a time.
        # macOS has no flock, and its runners are GitHub's, one to a machine.
        if command -v flock >/dev/null; then
          flock "$elan_home/.lanes-toolchain.lock" \
            "$elan_home/bin/elan" toolchain install "$(cat lean-toolchain)"
        else
          "$elan_home/bin/elan" toolchain install "$(cat lean-toolchain)"
        fi
    - id: keys
      shell: bash
      env:
        ROOT: ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
        SYSTEM: ${{ inputs.system }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', format('examples/{0}/lake-manifest.json', inputs.system)) }}
        SHA: ${{ github.sha }}
      run: |
        {
          echo "packages=lake-packages-$ROOT"
          echo "build-prefix=lake-build-$ROOT-"
          echo "build=lake-build-$ROOT-$SHA"
          echo "system-prefix=lake-system-$SYSTEM-"
          echo "system=lake-system-$SYSTEM-$SHA"
        } >> "$GITHUB_OUTPUT"
    - id: shared
      name: The machine's shared packages
      shell: bash
      env:
        SYSTEM: ${{ inputs.system }}
      run: |
        if [ -z "${LANES_SHARED:-}" ]; then echo "warm=false" >> "$GITHUB_OUTPUT"; exit 0; fi
        export PATH="${ELAN_HOME:-$HOME/.elan}/bin:$PATH"
        key=$(cat lean-toolchain lake-manifest.json | sha256sum | cut -c1-16)
        dir="$LANES_SHARED/$key"
        mkdir -p .lake
        exec 9>"$LANES_SHARED/lock"
        flock 9
        if [ ! -f "$dir/ready" ]; then
          echo "Making the shared packages for $key"
          rm -rf "$dir" .lake/packages
          mkdir -p "$dir/packages"
          ln -sfn "$dir/packages" .lake/packages
          lake exe cache get
          # Builds the dependencies' modules that Lanes imports, so that jobs only read them.
          lake build Lanes || echo "::warning::Lanes does not build; what it would have built of the dependencies is built later, by the jobs"
          touch "$dir/ready"
        fi
        flock -u 9
        if [ "$(readlink .lake/packages || true)" != "$dir/packages" ]; then
          rm -rf .lake/packages
          ln -s "$dir/packages" .lake/packages
        fi
        if [ ! -d .lake/build ] && [ -d "$dir/build" ]; then cp -a "$dir/build" .lake/build; fi
        if [ -n "$SYSTEM" ]; then
          mkdir -p "examples/$SYSTEM/.lake"
          ln -sfn "$GITHUB_WORKSPACE/.lake/packages" "examples/$SYSTEM/.lake/packages"
          if [ ! -d "examples/$SYSTEM/.lake/build" ] && [ -d "$dir/systems/$SYSTEM/build" ]; then
            cp -a "$dir/systems/$SYSTEM/build" "examples/$SYSTEM/.lake/build"
          fi
        fi
        echo "warm=true" >> "$GITHUB_OUTPUT"
    - id: packages
      if: steps.shared.outputs.warm != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .lake/packages
        key: ${{ steps.keys.outputs.packages }}
    - if: steps.shared.outputs.warm != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .lake/build
        key: ${{ steps.keys.outputs.build }}
        restore-keys: ${{ steps.keys.outputs.build-prefix }}
    - name: Fetch Mathlib's build
      if: steps.shared.outputs.warm != 'true' && steps.packages.outputs.cache-hit != 'true'
      shell: bash
      run: lake exe cache get
    - if: steps.shared.outputs.warm != 'true' && inputs.system != ''
      shell: bash
      env:
        SYSTEM: ${{ inputs.system }}
      run: |
        mkdir -p "examples/$SYSTEM/.lake"
        ln -sfn "$GITHUB_WORKSPACE/.lake/packages" "examples/$SYSTEM/.lake/packages"
    - if: steps.shared.outputs.warm != 'true' && inputs.system != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: examples/${{ inputs.system }}/.lake/build
        key: ${{ steps.keys.outputs.system }}
        restore-keys: ${{ steps.keys.outputs.system-prefix }}
